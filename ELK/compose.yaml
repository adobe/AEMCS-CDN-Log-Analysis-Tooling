services:
  elasticsearch:
    image: elasticsearch:8.10.1
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - ./elasticsearch/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
    networks:
      - elastic
  logstash:
    image: logstash:8.10.1
    container_name: logstash
    environment:
      discovery.seed_hosts: logstash
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - ./logs:/usr/share/logstash/data/logs
      - ./logstash/pipeline/logstash-cdn-logs.config:/usr/share/logstash/pipeline/logstash-cdn-logs.config
    ports:
      - "6000:6000/tcp"
      - "6000:6000/udp"
      - "5044:5044"
      - "9600:9600"
    depends_on:
      - elasticsearch
    networks:
      - elastic
    command: logstash -f /usr/share/logstash/pipeline/logstash-cdn-logs.config
  kibana:
    image: kibana:8.10.1
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elastic
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      INTERACTIVESETUP_ENABLED: false
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
  # Optional AI-assisted analysis, behind the "mcp" profile so that a plain
  # `docker compose up -d` is unaffected. See mcp/README.md and mcp/CLIENTS.md.
  aem-cdn-logs-mcp:
    image: docker.elastic.co/mcp/elasticsearch:0.4.6
    container_name: aem-cdn-logs-mcp
    profiles:
      - mcp
    # Streamable-HTTP transport. Endpoint /mcp, health /ping.
    command: ["http"]
    environment:
      ES_URL: "http://elasticsearch:9200"
      # Unset by default: the bundled Elasticsearch runs with security
      # disabled. Set these in ELK/.env (git-ignored) if you enable it.
      ES_API_KEY: "${ES_API_KEY:-}"
      ES_USERNAME: "${ES_USERNAME:-}"
      ES_PASSWORD: "${ES_PASSWORD:-}"
      ES_SSL_SKIP_VERIFY: "${ES_SSL_SKIP_VERIFY:-false}"
    ports:
      # Loopback only: the MCP server has no authentication of its own and can
      # read every index in the cluster.
      - "127.0.0.1:${MCP_PORT:-8080}:8080"
    # Start ordering only. service_healthy would abort `up` whenever
    # Elasticsearch outlasts its healthcheck (10s x 3, no start_period), and
    # the MCP server connects lazily anyway.
    depends_on:
      - elasticsearch
    restart: unless-stopped
    healthcheck:
      # The image has no curl or wget, so check the listener with netstat.
      test: ["CMD-SHELL", "netstat -lnt | grep -q ':8080 '"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - elastic
networks:
  elastic:
    driver: bridge
